version: "3.9"

services:
  backend:
    build: ./backend
    ports:
      - "8000:10000"
    env_file:
      - ./backend/.env.example
    volumes:
      - ./backend/uploads:/app/uploads

  frontend:
    image: node:20
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
    environment:
      VITE_API_BASE_URL: http://localhost:8000
